services:

  app:
    build: .
    image: oxyiramus/dusktilldawn:dev
    container_name: dusktilldawn-app
    env_file:
      - .env
    ports:
      - "${WEB_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: dusktilldawn-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: pg_isready --dbname=$${POSTGRES_DB} --host=127.0.0.1 --port=5432
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
